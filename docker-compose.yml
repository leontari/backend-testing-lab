version: "3.9"

services:

  ###########
  # DATABASES
  ###########

  postgres-order:
    image: postgres:16
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    networks:
      - backend-net

  postgres-payment:
    image: postgres:16
    container_name: postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5434:5432"
    networks:
      - backend-net

  postgres-notification:
    image: postgres:16
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5435:5432"
    networks:
      - backend-net

  #######
  # KAFKA
  #######

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - backend-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend-net

  ###############
  # OBSERVABILITY
  ###############

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - backend-net

  ##########
  # SERVICES (stubs for now)
  ##########

  gateway-service:
    build: ./services/gateway-service
    ports:
      - "8000:8000"
    depends_on:
      - kafka
    networks:
      - backend-net

  order-service:
    build: ./services/order-service
    ports:
      - "8001:8000"
    depends_on:
      - postgres-order
      - kafka
    networks:
      - backend-net

  payment-service:
    build: ./services/payment-service
    ports:
      - "8002:8000"
    depends_on:
      - postgres-payment
      - kafka
    networks:
      - backend-net

  notification-service:
    build: ./services/notification-service
    ports:
      - "8003:8000"
    depends_on:
      - postgres-notification
      - kafka
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge