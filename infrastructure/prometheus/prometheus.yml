global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:

  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "gateway-service:8000"

  - job_name: "order"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "order-service:8000"

  - job_name: "payment"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "payment-service:8000"

  - job_name: "notification"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "notification-service:8000"
